name: e2e

# The full stack on the Floci AWS emulator: Terraform provisions S3, KMS, Secrets
# Manager, Route53 and SES; the integration suite runs under every storage, mail and key
# backend; then Playwright drives the web app and the operator console in a browser.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-floci:
    name: end-to-end on Floci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: docker/setup-buildx-action@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Stack up and demo data
        run: make up demo
      - name: Integration matrix (storage x mail x keys)
        run: make test-matrix
      - name: Browser tests
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
      - name: Stack logs on failure
        if: failure()
        run: docker compose -p open-hrms logs --tail 200
