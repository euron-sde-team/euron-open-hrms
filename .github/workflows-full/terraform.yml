name: terraform

on:
  push:
    branches: [main]
    paths: ["infra/terraform/**", ".github/workflows/terraform.yml"]
  pull_request:
    paths: ["infra/terraform/**", ".github/workflows/terraform.yml"]

permissions:
  contents: read

jobs:
  validate:
    name: fmt · validate (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [local-floci, aws-dev, aws-prod]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
      - run: terraform fmt -check -recursive infra/terraform
      - run: terraform -chdir=infra/terraform/envs/${{ matrix.env }} init -backend=false -input=false
      - run: terraform -chdir=infra/terraform/envs/${{ matrix.env }} validate

  tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --init
        working-directory: infra/terraform
      - run: tflint --recursive --minimum-failure-severity=warning
        working-directory: infra/terraform

  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkov (any unskipped finding fails)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/terraform
          framework: terraform
          config_file: infra/terraform/.checkov.yaml
          soft_fail: false
