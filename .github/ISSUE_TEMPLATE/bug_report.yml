name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Security issues: do not file here**, follow SECURITY.md instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. make up
        2. ...
    validations:
      required: true
  - type: dropdown
    id: env
    attributes:
      label: Environment
      options: [Local (Floci), Local against AWS, AWS (Terraform), Self-hosted (other), Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact keys, tokens and hostnames before pasting.
      render: text
