# Generated by scripts/gen-openapi.ts from apps/api/src/routes. Do not edit by hand: run `pnpm openapi`.
openapi: 3.1.0
info:
  title: Euron Open HRMS API
  version: 0.1.0
  description: |
    The tenant plane (/api) serves a workspace's HR, managers and employees with a tenant session
    token. The operator plane (/api/platform) serves platform operators with a separate token,
    signed with a different secret and audience. Errors are `{ "error": string, "code"?: string }`;
    unexpected failures return 500 with a `requestId` and never the underlying message.
  license: { name: MIT, identifier: MIT }
servers:
  - url: http://localhost:5005
    description: Local stack (make up)
  - url: https://api.{domain}
    variables: { domain: { default: example.com } }
components:
  securitySchemes:
    tenantBearer: { type: http, scheme: bearer, bearerFormat: JWT, description: "Tenant session from POST /api/auth/login (aud=tenant)." }
    operatorBearer: { type: http, scheme: bearer, bearerFormat: JWT, description: "Operator session from POST /api/platform/auth/login (aud=platform)." }
  schemas:
    Error:
      type: object
      required: [error]
      properties: { error: { type: string }, code: { type: string }, requestId: { type: string } }
tags:
  - name: "platform"
    description: "Operator console API (SaaS vendor's internal plane). Manages customer workspaces: list, suspend/reactivate, support-impersonate a tenant admin (audited), and headline metrics. NOT org-scoped; takes orgId explicitly."
  - name: "auth"
    description: "sign-in (with optional two-factor), sessions, and password recovery."
  - name: "signup"
    description: "PUBLIC company self-signup (no auth). The person who signs up creates the workspace and becomes its first ADMIN (Super-Admin model, as in Zoho People). The admin email must be verified before they can sign in: org starts PENDING_VERIFICATION, user starts INVITED."
  - name: "onboarding/public"
    description: "PUBLIC self-onboarding for a pre-hire candidate: no login, just the token in their link. The same case-backed flow the signed-in roster uses (see onboarding-portal.service.ts); the employee record is created only when HR approves. Two things stay deliberately different because the caller is unauthenticated: - a dedicated rate limiter, since anyone on the internet holding a link can call this; - policies are served from here, because a candidate cannot reach /api/content/policies. GET /:token GET /:token/policies PATCH /:token/sections/:key { values } | { rows } POST /:token/acknowledge { policyIds: [] } POST /:token/declare { fullName } GET /:token/assets POST /:token/assets/:assetId/acknowledge POST /:token/assets/declared DELETE /:token/assets/declared/:entryId POST /:token/documents multipart: file, sectionKey, category POST /:token/submit hands the form to HR"
  - name: "verify"
    description: "PUBLIC document verification. Mounted OUTSIDE authRequired on purpose, the entire point is that a bank, landlord or next employer can check a document without an account. Because it is public and unauthenticated, three things are deliberate: - Codes carry 60 bits of entropy, so the endpoint cannot be enumerated. - Only fields the issuer explicitly disclosed are returned. - It is rate limited, so it cannot be used as an oracle to grind codes."
  - name: "users"
    description: "Workspace user management: invite teammates, list users, resend invites, enable/disable accounts, and assign roles (built-in or custom). Gated by the `users.manage` permission. Distinct from employees: these are login accounts."
  - name: "roles"
    description: "Roles & permissions API. Built-in roles are read-only (defined in rbac.js); custom roles are per-org and live in org.data.customRoles. Reading is open to staff (for the user-role dropdown); mutations require the `roles.manage` permission."
  - name: "mfa"
    description: "Two-factor auth (TOTP) management for the signed-in user."
  - name: "email-domain"
    description: "the workspace's own sending domain (one per workspace). A tenant brings their domain, publishes DNS, verifies via SES, and once VERIFIED its HRMS email goes out from that brand domain. See services/sending-domain.service.ts. Gated by settings.manage."
  - name: "notifications"
    description: "In-app notifications, per-user feed + unread badge."
  - name: "push"
    description: "Web push subscription management, plus the clock-in reminder settings. Every route here tolerates the `push_subscriptions` table not existing yet (the migration is developer-run), so the app keeps working and simply reports push as unavailable rather than 500-ing."
  - name: "audit"
    description: "Audit log viewer (staff), who did what, newest first."
  - name: "org"
    description: "the workspace profile, branding images, settings, offices and data export."
  - name: "departments"
    description: "list for everyone, changes for staff."
  - name: "employees"
    description: "the roster, hiring, bulk edit and import, portal access, and removal."
  - name: "leave"
    description: "leave types, balances, requests and decisions, coverage and the company leave rules."
  - name: "documents"
    description: "the searchable document library, KYC status, uploads and verification. GET /meta categories, KYC set and visibility options for the UI GET / the library (?q=&category=&departmentId=&employeeId=&tag=&visibility=&verified=) GET /kyc-status which required KYC documents are missing POST / multipart upload: title, category, description, tags, employeeId?, visibility, departmentIds GET /extraction/config what AI reading is available PATCH /:id staff: retitle, recategorise, re-scope, retag GET /:id/download DELETE /:id staff, or owner of own upload POST /:id/verify staff: { verified, note }, mark a KYC/bank doc verified"
  - name: "attendance"
    description: "geofenced check-in/out for employees, day view and regularization for staff."
  - name: "salary"
    description: "salary structures, payslips, pay runs and the org's payroll rules."
  - name: "letters"
    description: "/api/letters (staff): issue letters as PDFs, filed as private documents and emailed. POST /offer/bulk offer letters for many people GET /issuable/:employeeId what can be issued for this person POST /issue/:employeeId any on-demand letter { kind, ... } GET /status which letters each person has on file POST /offer/:employeeId POST /confirmation/:employeeId POST /probation-extension/:employeeId GET /probation-due whose probation ends soon (?withinDays=) POST /relieving/:employeeId POST /appraisal/:employeeId"
  - name: "letter-templates"
    description: "Letter template editing. Gated by settings.manage: letter copy is a legal artefact of the organisation, and an appointment letter's terms are not something every HR user should be able to rewrite. GET / every kind with its current template GET /tokens the palette shown beside the editor GET /:kind PUT /:kind save this organisation's wording DELETE /:kind go back to the built-in wording POST /:kind/preview render the PDF (unsaved `template` and `employeeId` optional)"
  - name: "onboarding"
    description: "HR onboarding invites: send a self-onboarding link to a candidate's personal email. GET /invites POST /invites one candidate, or { invites: [...] } for a batch PUT /invites/:id correct an invite that is not yet completed POST /invites/:id/resend DELETE /invites/:id also cancels the case the invite opened"
  - name: "onboarding-templates"
    description: "Onboarding form templates: the builder's API. Gated by settings.manage rather than onboarding.manage, matching letter-templates.routes.ts and for the same reason. A template decides which statutory identifiers are collected and which of them are mandatory before somebody can be paid; that is an organisation-level decision, not something every HR user should be able to rewrite between sends. GET /meta the builder's palette GET / newest first (?status=) GET /resolve which template a person would get (?employmentType=&departmentId=) GET /:id POST / a template, or { presetKey }; created DRAFT PUT /:id merged over the stored template; bumps `version` POST /:id/status { status } POST /:id/default make this the fallback form POST /:id/duplicate DELETE /:id refused once the form has been sent"
  - name: "onboarding-cases"
    description: "Onboarding cases: the employee's own form, and HR's review queue. Two audiences in one router, deliberately. /me/* the signed-in person filling their own form in. This is the entry point for the EXISTING roster: a campaign emails a deep link, they sign in normally, and 2FA, lockout and session rules all apply, which they would not if the link carried its own credential. /* HR reviewing what came back. Reads need staff access; approving needs onboarding.review, because approval is what writes a bank account and statutory identifiers onto the employee record. Nothing in the /me half can write to `employees`. It only ever stages onto the case. GET /me the form I have been asked to complete PATCH /me/sections/:key { values } | { rows } POST /me/acknowledge { policyIds: [] } POST /me/declare { fullName } GET /me/assets what HR issued me POST /me/assets/:assetId/acknowledge POST /me/assets/declared something else I was given DELETE /me/assets/declared/:entryId POST /me/documents multipart: file, sectionKey, category POST /me/submit hand the form to HR GET / ?status=&departmentId=&campaignId=&overdue= GET /export.csv status and progress only, never answers GET /:id the case plus the diff to approve POST /:id/sections/:key/review { verdict, note? } POST /:id/approve the commit POST /:id/cancel { reason } POST / { employeeId, templateId?, dueAt? }"
  - name: "onboarding-campaigns"
    description: "Onboarding campaigns: send one form to a slice of the roster, with a deadline. Launching is deliberately a two-step: /preview says exactly who would be included and who would be skipped, and /launch is a separate call. Emailing several hundred people is not something to discover you have done. GET / POST /preview { audience, templateId? } GET /reminder-settings PUT /reminder-settings GET /:id POST / { name, templateId, audience, dueAt, message? } PUT /:id editable only while it is still a draft POST /:id/launch queues the fan-out GET /:id/cases progress per person GET /:id/cases.csv POST /:id/close stop chasing; open cases stay open POST /:id/cancel also cancels every case nobody has started POST /run-reminders run the deadline sweep for this org now"
  - name: "reimbursements"
    description: "Reimbursement claims, submit (with receipt), approve / reject / mark paid."
  - name: "content"
    description: "Leave calendar (holidays), company policies, and company benefits."
  - name: "separation"
    description: "Employee separation / offboarding, type-aware flows. Resignation (employee): PENDING_MANAGER -> PENDING_HR -> NOTICE_PERIOD -> IN_CLEARANCE -> COMPLETED (withdraw before accept) Termination/Retirement/End-of-contract (HR): NOTICE_PERIOD -> IN_CLEARANCE -> COMPLETED Absconding (HR): ABSCONDING (warning letters) -> ABSCONDED The rules live in services/separation.service.ts."
  - name: "directory"
    description: "Company directory, org-chart and common org info, visible to everyone."
  - name: "announcements"
    description: "Company announcements / notice board, HR posts, everyone reads."
  - name: "vendors"
    description: "Vendors / consultants / providers, onboarding + billing. HR onboards a vendor (optionally creating a VENDOR login). The vendor signs in and raises bills/invoices (with an invoice attachment); HR approves / rejects / marks them paid as part of accounts-payable / payroll processing."
  - name: "performance"
    description: "Performance: PIP (improvement program) + appraisal cycles + appraisals."
  - name: "worklogs"
    description: "Daily work / productivity log, onsite / offsite / client / remote work."
  - name: "assets"
    description: "Asset provisioning & submission, laptops, devices, access cards, etc."
  - name: "ai-tokens"
    description: "AI token access, per-employee AI usage allowance (grant + request more)."
  - name: "perks"
    description: "Perks, goodies & coupon distribution + family-benefit enrolment."
  - name: "wellbeing"
    description: "Employee health & mental well-being, pulse check-ins, aggregate, resources."
  - name: "reports"
    description: "dashboard numbers, reporting structure, weekly digest and CSV exports."
  - name: "views"
    description: "Saved Views, recallable filter presets, per user, per resource (Shopify-style)."
  - name: "reminders"
    description: "Reminders / \"My Work\", a personal to-do layer, per user, per organization."
