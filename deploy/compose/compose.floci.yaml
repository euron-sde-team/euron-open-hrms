# ─────────────────────────────────────────────────────────────────────────────
# Overlay: emulated AWS with Floci (https://github.com/floci-io/floci, MIT).
#
# The SAME Terraform that provisions real AWS (infra/terraform/modules) runs here
# against the emulator: the `terraform` one-shot applies infra/terraform/envs/local-floci
# (documents bucket, KMS key, secrets, Route53 zone, SES identity with DKIM) before the
# API starts. The API then uses S3, KMS and SES exactly as it does on AWS:
#
#   documents      S3 bucket hrms-local-documents, SSE-KMS
#   personal data  per-workspace keys wrapped by KMS (alias/hrms-local)
#   mail           SES v2, platform identity open-hrms.test verified through DKIM,
#                  workspaces add their own sending domains from Settings; the emulator
#                  relays every message to Mailpit (http://localhost:8025)
# ─────────────────────────────────────────────────────────────────────────────
x-floci-env: &floci-env
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_ENDPOINT_URL: http://floci:4566
  STORAGE: s3
  S3_BUCKET: hrms-local-documents
  KMS_MODE: aws
  KMS_KEY_ID: alias/hrms-local
  MAIL_MODE: ses
  SES_CONFIGURATION_SET: hrms-local-mail
  MAIL_FROM: ${HRMS_PRODUCT_NAME:-Euron Open HRMS} <no-reply@open-hrms.test>

services:
  floci:
    image: floci/floci:2.3.0
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_DEFAULT_REGION: us-east-1
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /data
      # Relay every SES send to Mailpit so mail can be read in a browser.
      FLOCI_SERVICES_SES_SMTP_HOST: mailpit
      FLOCI_SERVICES_SES_SMTP_PORT: "1025"
    ports:
      - "127.0.0.1:${HRMS_FLOCI_PORT:-4576}:4566"
    volumes:
      - flocidata:/data
    networks:
      default:
        # The S3 Control API (bucket tagging) addresses <account-id>.<endpoint>, so the
        # emulated account's name has to resolve to the emulator as well.
        aliases: ["000000000000.floci"]

  # One-shot: provision the emulator with the production modules.
  terraform:
    image: hashicorp/terraform:1.16.6
    working_dir: /infra/envs/local-floci
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "waiting for floci..."
        until wget -q -O /dev/null http://floci:4566/; do sleep 1; done
        mkdir -p /tfdata/state
        terraform init -input=false -no-color >/dev/null
        # State lives in the tfdata volume, so it shares the emulator's lifecycle
        # (make down -v wipes both together).
        terraform apply -input=false -auto-approve -no-color -state=/tfdata/state/local.tfstate -var endpoint=http://floci:4566
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: "1"
      TF_DATA_DIR: /tfdata
    volumes:
      - ../../infra/terraform:/infra
      - tfdata:/tfdata
    depends_on:
      - floci
    restart: "no"

  api:
    environment:
      <<: *floci-env
    depends_on:
      terraform:
        condition: service_completed_successfully

volumes:
  flocidata:
  tfdata:
