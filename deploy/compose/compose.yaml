# ─────────────────────────────────────────────────────────────────────────────
# Euron Open HRMS: local stack (cloud-agnostic base).
#
# Never run this file alone. Pair it with a cloud overlay:
#   make up        # = compose.yaml + compose.floci.yaml  (emulated AWS, no account needed)
#   make up-aws    # = compose.yaml + compose.aws.yaml    (real AWS resources)
#
# Secrets come from deploy/compose/.env, generated by `make env`
# (scripts/gen-local-env.sh). They are random, local-only throwaways.
#
# Host ports (override in .env if they clash with something you already run):
#   web 3410   console 3420   api 5005   postgres 5442   mailpit 8025   floci 4576
# ─────────────────────────────────────────────────────────────────────────────
name: open-hrms

x-api-env: &api-env
  # Development mode keeps the production guards as warnings: the local stack talks to
  # an emulator and links to localhost, both of which production refuses on purpose.
  NODE_ENV: development
  TZ: UTC
  PORT: "8080"
  LOG_LEVEL: ${HRMS_LOG_LEVEL:-info}
  DATABASE_URL: postgres://hrms:hrms@postgres:5432/hrms
  MIGRATE_ON_BOOT: "true"
  PRODUCT_NAME: ${HRMS_PRODUCT_NAME:-Euron Open HRMS}
  JWT_SECRET: ${HRMS_JWT_SECRET:?run `make env` first}
  PLATFORM_JWT_SECRET: ${HRMS_PLATFORM_JWT_SECRET:?run `make env` first}
  DOC_VERIFY_SECRET: ${HRMS_DOC_VERIFY_SECRET:?run `make env` first}
  CORS_ORIGINS: http://localhost:${HRMS_WEB_PORT:-3410},http://localhost:${HRMS_CONSOLE_PORT:-3420},http://127.0.0.1:${HRMS_WEB_PORT:-3410},http://127.0.0.1:${HRMS_CONSOLE_PORT:-3420}
  APP_WEB_URL: http://localhost:${HRMS_WEB_PORT:-3410}
  PORTAL_URL: http://localhost:${HRMS_WEB_PORT:-3410}
  APP_BASE_URL: http://localhost:${HRMS_API_PORT:-5005}

services:
  postgres:
    image: postgres:16.12-alpine
    environment:
      POSTGRES_DB: hrms
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: hrms
    ports:
      - "127.0.0.1:${HRMS_PG_PORT:-5442}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrms -d hrms"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Every mail the stack sends lands here (directly with MAIL_MODE=smtp, or relayed by
  # the emulator's SES with MAIL_MODE=ses). Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27.9
    ports:
      - "127.0.0.1:${HRMS_MAILPIT_PORT:-8025}:8025"
      # SMTP, for MAIL_MODE=smtp (the integration matrix sends straight to it).
      - "127.0.0.1:${HRMS_SMTP_PORT:-1025}:1025"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    image: open-hrms-api:local
    environment:
      <<: *api-env
    ports:
      - "127.0.0.1:${HRMS_API_PORT:-5005}:8080"
    tmpfs:
      - /tmp:uid=1000,gid=1000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    image: open-hrms-web:local
    environment:
      # The browser calls the API directly, so this is the host-facing address.
      API_URL: http://localhost:${HRMS_API_PORT:-5005}/api
      PRODUCT_NAME: ${HRMS_PRODUCT_NAME:-Euron Open HRMS}
    ports:
      - "127.0.0.1:${HRMS_WEB_PORT:-3410}:8080"
    restart: unless-stopped

  console:
    build:
      context: ../..
      dockerfile: infra/docker/console.Dockerfile
    image: open-hrms-console:local
    environment:
      API_URL: http://localhost:${HRMS_API_PORT:-5005}/api
      TENANT_URL: http://localhost:${HRMS_WEB_PORT:-3410}
      PRODUCT_NAME: ${HRMS_PRODUCT_NAME:-Euron Open HRMS}
    ports:
      - "127.0.0.1:${HRMS_CONSOLE_PORT:-3420}:8080"
    restart: unless-stopped

volumes:
  pgdata:
